<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DocuMind Enterprise | AI Corporate Brain</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --panel-bg: rgba(30, 41, 59, 0.7);
            --accent-color: #38bdf8;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --border-color: #334155;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        header {
            padding: 1.5rem 2rem;
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(10px);
            border-bottom: 1px border var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 700;
            background: linear-gradient(to right, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            max-width: 900px;
            margin: 0 auto;
            width: 100%;
        }

        .chat-container {
            width: 100%;
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            overflow-y: auto;
            padding-right: 1rem;
            scrollbar-width: thin;
            scrollbar-color: var(--border-color) transparent;
        }

        .chat-container::-webkit-scrollbar {
            width: 6px;
        }

        .chat-container::-webkit-scrollbar-thumb {
            background-color: var(--border-color);
            border-radius: 10px;
        }

        .message {
            padding: 1.25rem;
            border-radius: 1rem;
            max-width: 85%;
            line-height: 1.6;
            animation: fadeIn 0.3s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .user-message {
            background-color: var(--border-color);
            align-self: flex-end;
            border-bottom-right-radius: 0.25rem;
        }

        .ai-message {
            background-color: var(--panel-bg);
            align-self: flex-start;
            border-bottom-left-radius: 0.25rem;
            border: 1px solid var(--border-color);
        }

        .citations {
            margin-top: 0.75rem;
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .citation-tag {
            font-size: 0.75rem;
            background: rgba(56, 189, 248, 0.1);
            color: var(--accent-color);
            padding: 0.25rem 0.6rem;
            border-radius: 9999px;
            border: 1px solid rgba(56, 189, 248, 0.2);
            display: flex;
            align-items: center;
            gap: 0.25rem;
        }

        .input-area {
            width: 100%;
            margin-top: 2rem;
            position: relative;
        }

        input {
            width: 100%;
            padding: 1.25rem 4rem 1.25rem 1.5rem;
            background-color: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 1rem;
            color: var(--text-primary);
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        input:focus {
            border-color: var(--accent-color);
            box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.2);
        }

        .send-btn {
            position: absolute;
            right: 0.75rem;
            top: 50%;
            transform: translateY(-50%);
            background: var(--accent-color);
            border: none;
            width: 2.75rem;
            height: 2.75rem;
            border-radius: 0.75rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.1s;
        }

        .send-btn:active {
            transform: translateY(-50%) scale(0.95);
        }

        .loading {
            display: none;
            color: var(--text-secondary);
            font-size: 0.875rem;
            margin-bottom: 0.5rem;
            align-self: flex-start;
        }

        .dot-pulse {
            position: relative;
            left: -9999px;
            width: 5px;
            height: 5px;
            border-radius: 5px;
            background-color: var(--accent-color);
            color: var(--accent-color);
            box-shadow: 9999px 0 0 0 var(--accent-color);
            animation: dot-pulse 1.5s infinite linear;
            margin-left: 20px;
            display: inline-block;
        }

        @keyframes dot-pulse {
            0% {
                box-shadow: 9999px 0 0 -5px var(--accent-color);
            }

            30% {
                box-shadow: 9999px 0 0 2px var(--accent-color);
            }

            60%,
            100% {
                box-shadow: 9999px 0 0 -5px var(--accent-color);
            }
        }
    </style>
</head>

<body>
    <header>
        <div class="logo">DocuMind Enterprise</div>
        <div style="display: flex; gap: 1rem; align-items: center;">
            <input type="file" id="fileUpload" style="display: none;" accept=".pdf" onchange="performUpload()">
            <button class="citation-tag" style="cursor: pointer; background: rgba(56, 189, 248, 0.2);"
                onclick="document.getElementById('fileUpload').click()">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                    <polyline points="17 8 12 3 7 8"></polyline>
                    <line x1="12" y1="3" x2="12" y2="15"></line>
                </svg>
                Upload PDF
            </button>
            <div style="color: var(--text-secondary); font-size: 0.8rem;">Powered by Gemini 1.5 Flash</div>
        </div>
    </header>

    <main>
        <div class="chat-container" id="chat">
            <div class="message ai-message">
                Hello! I am your Corporate Brain. You can ask me anything about your company documents (HR, Policies,
                SOPs).
            </div>
        </div>

        <div class="input-area">
            <div class="loading" id="loading">AI is thinking <div class="dot-pulse"></div>
            </div>
            <input type="text" id="queryInput" placeholder="Ask about policies, leave, reimbursements..."
                onkeypress="handleKey(event)">
            <button class="send-btn" onclick="askQuestion()">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <line x1="22" y1="2" x2="11" y2="13"></line>
                    <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                </svg>
            </button>
        </div>
    </main>

    <script>
        const chatContainer = document.getElementById('chat');
        const input = document.getElementById('queryInput');
        const loading = document.getElementById('loading');
        let chatHistory = [];

        async function askQuestion() {
            const query = input.value.trim();
            if (!query) return;

            // Add user message
            addMessage(query, 'user');
            input.value = '';

            // Show loading
            loading.style.display = 'block';

            // Create AI message placeholder for streaming
            const aiMessageDiv = document.createElement('div');
            aiMessageDiv.className = 'message ai-message';
            chatContainer.appendChild(aiMessageDiv);

            try {
                const response = await fetch('http://localhost:8000/query', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        question: query,
                        history: chatHistory
                    })
                });

                if (!response.ok) throw new Error('API Error');

                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                let fullAnswer = '';
                loading.style.display = 'none';

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;

                    const chunk = decoder.decode(value, { stream: true });

                    // Check if chunk contains SOURCES:
                    if (chunk.includes('\n\nSOURCES:')) {
                        const [answerPart, rawSources] = chunk.split('\n\nSOURCES: ');
                        fullAnswer += answerPart;
                        aiMessageDiv.innerText = fullAnswer; // Update answer text

                        try {
                            const sourceData = JSON.parse(rawSources.trim());
                            addCitations(aiMessageDiv, sourceData.sources, sourceData.pages);
                        } catch (e) { console.error("Source parsing error", e); }
                    } else {
                        fullAnswer += chunk;
                        aiMessageDiv.innerText = fullAnswer; // Typewriter effect
                    }

                    chatContainer.scrollTop = chatContainer.scrollHeight;
                }

                // Update history
                chatHistory.push({ role: 'user', content: query });
                chatHistory.push({ role: 'assistant', content: fullAnswer });
                if (chatHistory.length > 6) chatHistory = chatHistory.slice(-6); // Keep last 3 turns

            } catch (error) {
                loading.style.display = 'none';
                aiMessageDiv.innerText = "Connection error. Make sure the API server is running.";
            }
        }

        function addMessage(text, type) {
            const div = document.createElement('div');
            div.className = `message ${type}-message`;
            div.innerText = text;
            chatContainer.appendChild(div);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function addCitations(parentDiv, sources = [], pages = []) {
            if (sources.length === 0) return;
            const citeDiv = document.createElement('div');
            citeDiv.className = 'citations';

            const seen = new Set();
            sources.forEach((source, i) => {
                const filename = source.split(/[\\/]/).pop();
                const pageNum = (pages[i] || 0) + 1;
                const key = `${filename}-p${pageNum}`;

                if (!seen.has(key)) {
                    const tag = document.createElement('span');
                    tag.className = 'citation-tag';
                    tag.innerHTML = `<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline></svg> ${filename} (p. ${pageNum})`;
                    citeDiv.appendChild(tag);
                    seen.add(key);
                }
            });
            parentDiv.appendChild(citeDiv);
        }

        async function performUpload() {
            const fileInput = document.getElementById('fileUpload');
            if (fileInput.files.length === 0) return;

            const file = fileInput.files[0];
            const formData = new FormData();
            formData.append('file', file);

            loading.style.display = 'block';
            addMessage(`Uploading ${file.name}...`, 'ai');

            try {
                const response = await fetch('http://localhost:8000/upload', {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();
                loading.style.display = 'none';

                if (response.ok) {
                    addMessage(`Success: ${data.message}. You can now ask questions about it.`, 'ai');
                } else {
                    addMessage(`Error: ${data.detail}`, 'ai');
                }
            } catch (error) {
                loading.style.display = 'none';
                addMessage("Upload failed. Verify server connection.", 'ai');
            }
        }

        function handleKey(e) {
            if (e.key === 'Enter') askQuestion();
        }
    </script>
</body>

</html>
