<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DocuMind Enterprise | Knowledge Hub</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg-dark: #020617;
            --sidebar-bg: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.5);
            --accent-primary: #38bdf8;
            --accent-secondary: #818cf8;
            --text-main: #f8fafc;
            --text-dim: #94a3b8;
            --border: rgba(51, 65, 85, 0.5);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            overflow: hidden;
        }

        /* --- Sidebar / Knowledge Base --- */
        .sidebar {
            width: 320px;
            background-color: var(--sidebar-bg);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            padding: 1.5rem;
            z-index: 20;
        }

        .brand {
            font-size: 1.25rem;
            font-weight: 700;
            margin-bottom: 2rem;
            background: linear-gradient(to right, var(--accent-primary), var(--accent-secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .kb-section {
            flex: 1;
            overflow-y: auto;
        }

        .kb-header {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-dim);
            margin-bottom: 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .doc-list {
            list-style: none;
        }

        .doc-item {
            padding: 0.75rem 1rem;
            border-radius: 0.75rem;
            margin-bottom: 0.5rem;
            background: var(--card-bg);
            border: 1px solid transparent;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 0.75rem;
            transition: all 0.2s;
            cursor: default;
        }

        .doc-item:hover {
            border-color: var(--accent-primary);
            background: rgba(56, 189, 248, 0.05);
        }

        .doc-icon {
            color: var(--accent-primary);
        }

        .upload-area {
            margin-top: 1rem;
        }

        .btn-upload {
            width: 100%;
            padding: 0.75rem;
            border-radius: 0.75rem;
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            color: white;
            border: none;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            transition: opacity 0.2s;
        }

        .btn-upload:hover {
            opacity: 0.9;
        }

        /* --- Main Chat Area --- */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .chat-header {
            padding: 1rem 2rem;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(2, 6, 23, 0.8);
            backdrop-filter: blur(8px);
        }

        .chat-window {
            flex: 1;
            overflow-y: auto;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            scroll-behavior: smooth;
        }

        .message {
            max-width: 80%;
            padding: 1.25rem 1.5rem;
            border-radius: 1.25rem;
            line-height: 1.6;
            font-size: 0.95rem;
            position: relative;
            animation: slideUp 0.3s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .user-message {
            align-self: flex-end;
            background: var(--sidebar-bg);
            border: 1px solid var(--border);
            border-bottom-right-radius: 0.25rem;
        }

        .ai-message {
            align-self: flex-start;
            background: var(--card-bg);
            border-bottom-left-radius: 0.25rem;
            border-left: 3px solid var(--accent-primary);
        }

        .input-bar {
            padding: 2rem;
            background: linear-gradient(to top, var(--bg-dark) 60%, transparent);
        }

        .input-container {
            max-width: 900px;
            margin: 0 auto;
            position: relative;
        }

        .chat-input {
            width: 100%;
            padding: 1.25rem 4rem 1.25rem 1.5rem;
            background: var(--sidebar-bg);
            border: 1px solid var(--border);
            border-radius: 1rem;
            color: white;
            outline: none;
            transition: border-color 0.2s;
        }

        .chat-input:focus {
            border-color: var(--accent-primary);
        }

        .send-btn {
            position: absolute;
            right: 0.75rem;
            top: 50%;
            transform: translateY(-50%);
            background: var(--accent-primary);
            border: none;
            width: 2.5rem;
            height: 2.5rem;
            border-radius: 0.75rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
        }

        /* --- Citations & Utils --- */
        .citations {
            margin-top: 0.75rem;
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        .cite-tag {
            font-size: 0.7rem;
            background: rgba(56, 189, 248, 0.1);
            color: var(--accent-primary);
            padding: 0.2rem 0.5rem;
            border-radius: 4px;
            border: 1px solid rgba(56, 189, 248, 0.2);
            display: flex;
            align-items: center;
            gap: 0.3rem;
        }

        .status-indicator {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #22c55e;
            box-shadow: 0 0 10px #22c55e;
        }

        .loading-dots {
            display: none;
            color: var(--text-dim);
            font-size: 0.8rem;
            margin-bottom: 0.5rem;
            margin-left: 0.5rem;
        }

        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 10px;
        }
    </style>
</head>

<body>
    <!-- Sidebar / Knowledge Base -->
    <aside class="sidebar">
        <div class="brand">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                <path d="M12 2a10 10 0 1 0 10 10H12V2z"></path>
                <path d="M12 12L2.1 12.3"></path>
                <path d="M12 2a10 10 0 0 0-9.9 10H12V2z"></path>
            </svg>
            DocuMind HQ
        </div>

        <div class="kb-section">
            <div class="kb-header">
                Knowledge Base
                <span id="doc-count" style="background: var(--border); padding: 2px 6px; border-radius: 4px;">0</span>
            </div>
            <ul class="doc-list" id="docList">
                <!-- Docs will be injected here -->
            </ul>
        </div>

        <div class="upload-area">
            <input type="file" id="fileInput" style="display: none;" accept=".pdf" onchange="uploadPDF()">
            <button class="btn-upload" onclick="document.getElementById('fileInput').click()">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                    <polyline points="17 8 12 3 7 8"></polyline>
                    <line x1="12" y1="3" x2="12" y2="15"></line>
                </svg>
                Sync New Manual
            </button>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
        <header class="chat-header">
            <div style="display: flex; align-items: center; gap: 0.75rem;">
                <div class="status-indicator"></div>
                <span style="font-weight: 600;">Corporate Brain Active</span>
            </div>
            <span style="color: var(--text-dim); font-size: 0.8rem;">Gemini 1.5 Flash Enabled</span>
        </header>

        <section class="chat-window" id="chatWindow">
            <div class="message ai-message">
                Welcome to the Unified Knowledge Hub. I've indexed your corporate manuals. How can I assist you with
                policy extraction or data analysis today?
            </div>
        </section>

        <footer class="input-bar">
            <div class="input-container">
                <div class="loading-dots" id="loading">AI processing knowledge...</div>
                <input type="text" class="chat-input" id="userInput"
                    placeholder="Ask anything about your Knowledge Base..." onkeypress="checkEnter(event)">
                <button class="send-btn" onclick="sendMessage()">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                        stroke-width="2.5">
                        <line x1="22" y1="2" x2="11" y2="13"></line>
                        <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                    </svg>
                </button>
            </div>
        </footer>
    </main>

    <script>
        const chatWindow = document.getElementById('chatWindow');
        const docList = document.getElementById('docList');
        const docCount = document.getElementById('doc-count');
        const loading = document.getElementById('loading');
        let chatHistory = [];

        async function loadDocuments() {
            try {
                const response = await fetch('/documents');
                const data = await response.json();
                docList.innerHTML = '';
                docCount.innerText = data.documents.length;

                data.documents.forEach(doc => {
                    const li = document.createElement('li');
                    li.className = 'doc-item';
                    li.innerHTML = `
                        <svg class="doc-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline></svg>
                        ${doc}
                    `;
                    docList.appendChild(li);
                });
            } catch (e) { console.error("Loader error", e); }
        }

        async function uploadPDF() {
            const fileInput = document.getElementById('fileInput');
            if (!fileInput.files[0]) return;

            const formData = new FormData();
            formData.append('file', fileInput.files[0]);

            addMessage(`Syncing ${fileInput.files[0].name} to Knowledge Base...`, 'ai');
            loading.style.display = 'block';

            try {
                const response = await fetch('/upload', { method: 'POST', body: formData });
                const data = await response.json();
                loading.style.display = 'none';
                if (response.ok) {
                    addMessage(`Knowledge Base Updated: ${data.message}`, 'ai');
                    loadDocuments();
                } else {
                    addMessage(`Error: ${data.detail}`, 'ai');
                }
            } catch (e) {
                loading.style.display = 'none';
                addMessage("Sync failed. Check API connection.", 'ai');
            }
        }

        async function sendMessage() {
            const input = document.getElementById('userInput');
            const query = input.value.trim();
            if (!query) return;

            addMessage(query, 'user');
            input.value = '';
            loading.style.display = 'block';

            const aiMsgDiv = document.createElement('div');
            aiMsgDiv.className = 'message ai-message';
            aiMsgDiv.innerText = '...';
            chatWindow.appendChild(aiMsgDiv);

            try {
                const response = await fetch('/query', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ question: query, history: chatHistory })
                });

                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                let fullText = '';
                aiMsgDiv.innerText = '';
                loading.style.display = 'none';

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    const chunk = decoder.decode(value);

                    if (chunk.includes('\n\nSOURCES:')) {
                        const [text, sources] = chunk.split('\n\nSOURCES: ');
                        fullText += text;
                        aiMsgDiv.innerText = fullText;
                        try {
                            const sourceData = JSON.parse(sources);
                            renderCitations(aiMsgDiv, sourceData);
                        } catch (e) { }
                    } else {
                        fullText += chunk;
                        aiMsgDiv.innerText = fullText;
                    }
                    chatWindow.scrollTop = chatWindow.scrollHeight;
                }

                chatHistory.push({ role: 'user', content: query });
                chatHistory.push({ role: 'assistant', content: fullText });
                if (chatHistory.length > 8) chatHistory = chatHistory.slice(-8);

            } catch (e) {
                loading.style.display = 'none';
                aiMsgDiv.innerText = "Processing error. Please retry.";
            }
        }

        function addMessage(text, type) {
            const div = document.createElement('div');
            div.className = `message ${type}-message`;
            div.innerText = text;
            chatWindow.appendChild(div);
            chatWindow.scrollTop = chatWindow.scrollHeight;
        }

        function renderCitations(parent, data) {
            const div = document.createElement('div');
            div.className = 'citations';
            const seen = new Set();
            data.sources.forEach((src, i) => {
                const name = src.split(/[\\/]/).pop();
                const page = (data.pages[i] || 0) + 1;
                const key = `${name}-${page}`;
                if (!seen.has(key)) {
                    div.innerHTML += `
                        <span class="cite-tag">
                            <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline></svg>
                            ${name} (p.${page})
                        </span>
                    `;
                    seen.add(key);
                }
            });
            parent.appendChild(div);
        }

        function checkEnter(e) { if (e.key === 'Enter') sendMessage(); }

        // Initial documents load
        loadDocuments();
    </script>
</body>

</html>
